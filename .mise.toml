# Install everything with `mise install`. Run `mise tasks` to list tasks,
# `mise run <task>` to run one. Tasks live in ./.mise-tasks.

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
go = "1.27.4"

# Go client generation from the OpenAPI spec (config: oapi-codegen.yaml)
oapi-codegen = "v2.9.0"

# API changelogs for releases and breaking-change detection for the upstream API canary
"github:oasdiff/oasdiff" = "v1.39.0"

# Workflow linting
zizmor = "1.32.0"

[env]
UPSTREAM_REPO = "https://github.com/pocket-id/pocket-id.git"
UPSTREAM_DIR = ".upstream"
OPENAPI_SPEC = "openapi.json"
