name: Zizmor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".mise.toml"
      - "mise.lock"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".mise.toml"
      - "mise.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: zizmor

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .
