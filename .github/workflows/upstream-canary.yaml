name: Upstream API canary

# Hourly: generates the client from upstream pocket-id `main` and posts its API diff
# against the latest release on a locked dashboard issue, which is assigned while the
# client fails to build or the diff has breaking changes.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-canary
  cancel-in-progress: false

env:
  CANARY_LABEL: upstream-api-canary
  CANARY_ASSIGNEE: aclerici38
  # Only the tools in mise-action's install_args; `mise run` must not install the rest.
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve upstream main
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/pocket-id/pocket-id/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go oapi-codegen github:oasdiff/oasdiff

      # A failure is reported on the issue, not on the run.
      - name: Generate client from upstream main
        id: build
        continue-on-error: true
        env:
          UPSTREAM_REF: ${{ steps.upstream.outputs.sha }}
        run: mise run generate && mise run verify

      - name: Update canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BUILD: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.github/scripts/update-canary-issue.sh
