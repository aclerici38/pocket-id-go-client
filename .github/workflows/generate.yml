name: Generate Client

on:
  push:
    branches: [main]
    paths:
      - POCKET_ID_VERSION
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go swag go-swagger github:oasdiff/oasdiff

      - name: Generate client
        run: mise run generate

      - name: Verify build
        run: mise run verify

      - name: Get version
        id: version
        run: echo "version=$(cat POCKET_ID_VERSION | tr -d '\n')" >> $GITHUB_OUTPUT

      - name: API changelog
        id: changelog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Most recent release other than this one (skipping it handles re-runs).
          prev=$(gh release list --json tagName --jq 'map(.tagName | select(. != env.VERSION))[0]')
          git fetch --no-tags --depth=1 origin tag "$prev"

          # Run from RUNNER_TEMP so oasdiff reports the files by version, not by path.
          git show "$prev:swagger.yaml" > "$RUNNER_TEMP/$prev.yaml"
          cp swagger.yaml "$RUNNER_TEMP/$VERSION.yaml"
          (cd "$RUNNER_TEMP" && oasdiff changelog --color never "$prev.yaml" "$VERSION.yaml") > "$RUNNER_TEMP/changelog.txt"

          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.changelog.outputs.prev }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Checkout doesn't persist credentials; authenticate git via GH_TOKEN for this step only.
          gh auth setup-git

          # Build a commit holding only the files needed for the Go module.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git add -f LICENSE go.mod go.sum client/ models/ swagger.yaml
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git commit-tree "$tree" -p "$PREV" -m "Generated client from Pocket ID ${VERSION}")

          git diff "$PREV" "$commit" -- swagger.yaml > api-changes.diff

          # Delete existing tag/release if they exist
          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push origin ":refs/tags/$VERSION" 2>/dev/null || true

          # Tag and push only the tag
          git tag -f "$VERSION" "$commit"
          git push origin "refs/tags/${VERSION}" --force

          # Release bodies max out at 125000 characters; the full diff is attached either way.
          changelog="$RUNNER_TEMP/changelog.txt"
          {
            echo "Generated from [Pocket ID $VERSION](https://github.com/pocket-id/pocket-id/releases/tag/$VERSION)"
            echo
            echo "### API changes since $PREV"
            echo '```'
            if [ "$(wc -c < "$changelog")" -le 100000 ]; then
              cat "$changelog"
            else
              head -c 100000 "$changelog" | sed '$d'
              echo "... truncated, see api-changes.diff"
            fi
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

          release_args=("$VERSION" --title "Client $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ -f api-changes.diff ] && [ -s api-changes.diff ]; then
            release_args+=(api-changes.diff)
          fi
          gh release create "${release_args[@]}"
