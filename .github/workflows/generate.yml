name: Generate Client

on:
  push:
    branches: [main]
    paths:
      - POCKET_ID_VERSION
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Move POCKET_ID_VERSION's tag if it exists (breaks anything pinned to it)
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Only the tools in mise-action's install_args; `mise run` must not install the rest.
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  generate:
    # Builds the pinned POCKET_ID_VERSION (which releases) and upstream main, as the canary does.
    name: generate (${{ matrix.upstream-ref || 'POCKET_ID_VERSION' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        upstream-ref: ["", main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go oapi-codegen github:oasdiff/oasdiff

      # The clone happens in `mise run generate`, so read upstream's go.sum through the API.
      - name: Resolve upstream go.sum
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ matrix.upstream-ref }}
        run: |
          ref="${UPSTREAM_REF:-$(tr -d '\n' < POCKET_ID_VERSION)}"
          echo "go-sum=$(gh api "repos/pocket-id/pocket-id/contents/backend/go.sum?ref=$ref" --jq .sha)" >> "$GITHUB_OUTPUT"

      # Without this, compiling upstream's backend from scratch is most of the job. Keyed on
      # upstream's go.sum; a dependency bump restores the closest cache and rebuilds the rest.
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ steps.upstream.outputs.go-sum }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Generate client
        env:
          UPSTREAM_REF: ${{ matrix.upstream-ref }}
        run: mise run generate

      - name: Verify build
        run: mise run verify

      - name: Get version
        id: version
        run: echo "version=$(cat POCKET_ID_VERSION | tr -d '\n')" >> $GITHUB_OUTPUT

      - name: API changelog
        id: changelog
        if: matrix.upstream-ref == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Most recent release other than this one (skipping it handles re-runs).
          prev=$(gh release list --json tagName --jq 'map(.tagName | select(. != env.VERSION))[0]')
          git fetch --no-tags --depth=1 origin tag "$prev"

          # Run from RUNNER_TEMP so oasdiff reports the files by version, not by path.
          # An empty spec reports every endpoint as added; the release before v3 shipped swagger.yaml.
          git show "$prev:openapi.json" > "$RUNNER_TEMP/$prev.json" 2>/dev/null || echo '{"openapi":"3.1.0","info":{"title":"","version":""},"paths":{}}' > "$RUNNER_TEMP/$prev.json"
          cp openapi.json "$RUNNER_TEMP/$VERSION.json"
          (cd "$RUNNER_TEMP" && oasdiff changelog --color never "$prev.json" "$VERSION.json") > "$RUNNER_TEMP/changelog.txt"

          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: matrix.upstream-ref == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.changelog.outputs.prev }}
          FORCE: ${{ inputs.force }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Checkout doesn't persist credentials; authenticate git via GH_TOKEN for this step only.
          gh auth setup-git

          # Build a commit holding only the Go module and its README (shown on pkg.go.dev).
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git add -f LICENSE README.md go.mod go.sum client/ openapi.json
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git commit-tree "$tree" -p "$PREV" -m "Generated client from Pocket ID ${VERSION}")

          git diff "$PREV" "$commit" -- openapi.json > api-changes.diff

          # Pushed tags stay put (the Go module proxy and `next` build on them): pushing an
          # existing tag is rejected unless a manual run asks to force it.
          if [ "$FORCE" = true ]; then
            gh release delete "$VERSION" --yes 2>/dev/null || true
            git push origin ":refs/tags/$VERSION" 2>/dev/null || true
          fi

          # Tag and push only the tag
          git tag -f "$VERSION" "$commit"
          git push origin "refs/tags/${VERSION}"

          # Release bodies max out at 125000 characters; the full diff is attached either way.
          changelog="$RUNNER_TEMP/changelog.txt"
          {
            echo "Generated from [Pocket ID $VERSION](https://github.com/pocket-id/pocket-id/releases/tag/$VERSION)"
            echo
            echo "### API changes since $PREV"
            echo '```'
            if [ "$(wc -c < "$changelog")" -le 100000 ]; then
              cat "$changelog"
            else
              head -c 100000 "$changelog" | sed '$d'
              echo "... truncated, see api-changes.diff"
            fi
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

          release_args=("$VERSION" --title "Client $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ -f api-changes.diff ] && [ -s api-changes.diff ]; then
            release_args+=(api-changes.diff)
          fi
          gh release create "${release_args[@]}"
